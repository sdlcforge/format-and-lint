version: 2
items:
    - title: eslint-config.mjs at max-lines cap
      id: t0xt
      date: "2026-08-07"
      tags:
        - type:enhancement
        - priority:medium
        - plan/phase:phase-03-cli-rule-exemption
        - plan/slug:typescript-support
        - effort:unspecified
      text: 'src/lib/default-config/eslint-config.mjs is now at exactly 300 counted lines against its own ''max-lines'' rule cap (max: 300, skipBlankLines/skipComments) — landed at the edge by the phase-03 cli-rule-exemption task, which had to inline a files-array literal instead of hoisting a const specifically to stay under the cap. The next line of code added to this file will fail `make lint`. Split the file (e.g. extract each named config component — base/jsdoc/jsx/test/ts/tsJsdoc/cli — into its own module) before adding another component, rather than raising the cap.'
    - title: cli-rule-exemption minor notes
      id: iTol
      date: "2026-08-07"
      tags:
        - type:enhancement
        - priority:low
        - plan/phase:phase-03-cli-rule-exemption
        - plan/slug:typescript-support
        - effort:unspecified
      text: 'Two minor notes from the cli-rule-exemption task (informational, no action forced): (1) the `**/cli/**` glob matches everything under any `cli/` directory, not just entrypoint scripts -- e.g. library helpers like src/cli/lib/*.mjs also lose no-console/no-process-exit, which is what the task doc specified but is broader than the "entrypoints" framing implies; consumers with a large cli/ tree should be aware. (2) plan/phase-03-cli-rule-exemption/001-add-cli-rule-exemption.md''s requirement-2 code snippet shows a pre-phase-01 getEslintConfig signature (missing the ts/tsJsdoc components phase-01 added) -- stale if that doc is ever reused as a reference.'
    - title: src/docs/*.md orphaned from README link chain
      id: TNYF
      date: "2026-09-23"
      tags:
        - type:documentation
        - priority:unspecified
        - effort:unspecified
        - plan/phase:phase-02-doc-updates
        - plan/slug:typescript-support
      text: 'Phase-02 link-chain gate: src/docs/README.01.md and src/docs/README.02.md are not linked from README.md or any other project doc, so the link-chain reachability check flags them as orphans (minor, medium confidence). Structurally these are README build-source fragments (Makefile copies/cats them into the generated README.md), not separate reader-facing docs, so the content itself isn''t lost — but the literal link-chain rule keeps flagging them. Recommendation: either document (in README.md''s build/contributing notes, or in DEVELOPER_NOTES.md) that src/docs/*.md are generator-input fragments exempt from the link-chain rule the way plan/** is exempted, or add a lightweight link from README.md if a build/contributing section exists. Judgment call for the maintainer, not a mechanical fix.'
    - title: cli comment overclaims "entrypoint" scope
      id: ZZ7c
      date: "2026-09-23"
      tags:
        - type:documentation
        - plan/phase:fix-cli-doc-precision
        - priority:unspecified
        - effort:unspecified
      text: 'The source-code comment directly above `defaultCliConfig` in src/lib/default-config/eslint-config.mjs (around lines 404-407) says "A CLI entrypoint is identified by either of two independent signals: a ''cli/'' path segment ... or a ''-cli'' basename suffix" -- the same imprecision just corrected in README.md/docs/architecture.md (the path-segment branch actually exempts every file under cli/, not just entrypoints, e.g. library helpers like src/cli/lib/*.mjs). Technically accurate as intent/design commentary, but inconsistent with the now-corrected docs. Left untouched during the doc-only fix (out of that task''s scope). Consider rewording for consistency.'

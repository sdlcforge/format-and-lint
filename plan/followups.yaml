items:
    - title: cli comment overclaims "entrypoint" scope
      id: ZZ7c
      date: "2026-09-23"
      tags:
        - type:documentation
        - plan/phase:fix-cli-doc-precision
        - priority:unspecified
        - effort:unspecified
      text: 'The source-code comment directly above `defaultCliConfig` in src/lib/default-config/eslint-config.mjs (around lines 404-407) says "A CLI entrypoint is identified by either of two independent signals: a ''cli/'' path segment ... or a ''-cli'' basename suffix" -- the same imprecision just corrected in README.md/docs/architecture.md (the path-segment branch actually exempts every file under cli/, not just entrypoints, e.g. library helpers like src/cli/lib/*.mjs). Technically accurate as intent/design commentary, but inconsistent with the now-corrected docs. Left untouched during the doc-only fix (out of that task''s scope). Consider rewording for consistency.'

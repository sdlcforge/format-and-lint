      text: 'Two minor notes from the cli-rule-exemption task (informational, no action forced): (1) the `**/cli/**` glob matches everything under any `cli/` directory, not just entrypoint scripts -- e.g. library helpers like src/cli/lib/*.mjs also lose no-console/no-process-exit, which is what the task doc specified but is broader than the "entrypoints" framing implies; consumers with a large cli/ tree should be aware. (2) plan/phase-03-cli-rule-exemption/001-add-cli-rule-exemption.md''s requirement-2 code snippet shows a pre-phase-01 getEslintConfig signature (missing the ts/tsJsdoc components phase-01 added) -- stale if that doc is ever reused as a reference.'
    - title: src/docs/*.md orphaned from README link chain
      id: TNYF
      date: "2026-09-23"
      tags:
        - type:documentation
        - priority:unspecified
        - effort:unspecified
        - plan/phase:phase-02-doc-updates
        - plan/slug:typescript-support
      text: 'Phase-02 link-chain gate: src/docs/README.01.md and src/docs/README.02.md are not linked from README.md or any other project doc, so the link-chain reachability check flags them as orphans (minor, medium confidence). Structurally these are README build-source fragments (Makefile copies/cats them into the generated README.md), not separate reader-facing docs, so the content itself isn''t lost — but the literal link-chain rule keeps flagging them. Recommendation: either document (in README.md''s build/contributing notes, or in DEVELOPER_NOTES.md) that src/docs/*.md are generator-input fragments exempt from the link-chain rule the way plan/** is exempted, or add a lightweight link from README.md if a build/contributing section exists. Judgment call for the maintainer, not a mechanical fix.'

items:
    - title: package ignores read devPkg, not _sdlc
      id: aylA
      date: "2026-10-04"
      tags:
        - type:bug
        - priority:medium
        - effort:medium
      text: src/lib/lib/process-package-ignores.mjs reads package.json:devPkg.linting.ignores (also named in src/cli/cli-spec.mjs), but this repo's own package.json keeps its lint ignores under _sdlc.linting.ignores, so the ignores are likely never applied. Decide on the canonical key (or support both) and update code, test, and docs.
    - title: Coverage badge builder assumes jest output
      id: hFOz
      date: "2026-10-04"
      tags:
        - type:documentation
        - priority:unspecified
        - effort:unspecified
      text: .sdlc-data.yaml registers the @liquid-labs/sdlc-projects-badges-coverage builder that produces .readme-assets/coverage.svg, presumably from jest coverage output under qa/coverage (Makefile). After the bun:test migration the coverage format is lcov/text; confirm the badge builder still works or switch its input, otherwise the README coverage badge goes stale.
